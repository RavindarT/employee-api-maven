services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: employee
      POSTGRES_PASSWORD: employee_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - employee-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee -d employee_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  employee-data:
